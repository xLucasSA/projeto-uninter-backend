[project]
name = "raizes-backoffice"
version = "0.1.0"
description = "Back-office (Django Admin) da rede Raízes do Nordeste"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<6.0",
    "argon2-cffi>=23.1",
    "psycopg[binary]>=3.2",
    "dj-database-url>=2.3",
    "gunicorn>=23.0",
    "whitenoise>=6.8",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "django-stubs[compatible-mypy]>=5.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "S", "ASYNC", "DJ"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501", "N806"]
"demo/management/commands/seed_demo.py" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
disallow_untyped_defs = true
exclude = ["/migrations/"]

[tool.django-stubs]
django_settings_module = "config.settings"
